services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sd-agent-iq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sd_agent_iq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sd_agent_iq"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
